<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE69A"/>
      <stop offset="0.5" stop-color="#F5B82E"/>
      <stop offset="1" stop-color="#B07A12"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9AA3AE"/>
    </linearGradient>
  </defs>
  <!-- Gold "A" peak -->
  <polygon points="100,18 186,178 146,178 100,90 54,178 14,178" fill="url(#gold)"/>
  <!-- Silver bar across the A -->
  <polygon points="66,140 134,140 146,164 54,164" fill="url(#silver)"/>
  <!-- Small gold gem on top -->
  <polygon points="100,4 110,16 100,28 90,16" fill="#FFE69A"/>
</svg>
